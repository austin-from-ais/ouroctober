# Publishes the site to GitHub Pages on every push to main.
# js/private.js is never committed; it is written here from repository secrets
# (SITE_PHONE, STARDEW_CODE) so the tea tins can open a text to Austin.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write js/private.js from secrets
        env:
          SITE_PHONE: ${{ secrets.SITE_PHONE }}
          STARDEW_CODE: ${{ secrets.STARDEW_CODE }}
        run: |
          printf 'window.SITE_PRIVATE = { phone: "%s", stardewCode: "%s" };\n' "$SITE_PHONE" "$STARDEW_CODE" > js/private.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
